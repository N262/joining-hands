<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red App Portal</title>
    <style>
        html, body {
            min-height: 100%;
        }

        body {
            margin: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-family: "DM Sans", sans-serif;
            background: var(--black);
            color: var(--cream);
            overflow: hidden;
        }

        * {
            box-sizing: border-box;
        }
        @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@400;500;600&display=swap");

        :root {
            --saffron: #ff9d45;
            --cream: #f5eadc;
            --muted: #aaa29a;
            --green: #2e8b57;
            --black: #06090d;
        }

        button, input {
            font: inherit;
        }

        .portal {
            min-height: 100svh;
            width: 100%;
            position: relative;
            overflow: hidden;
            isolation: isolate;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 72% 45%, rgba(255, 147, 57, .09), transparent 30%),
                radial-gradient(circle at 25% 80%, rgba(25, 118, 61, .08), transparent 32%),
                #06090d;
        }

        .mesh {
            position: absolute;
            inset: -25%;
            z-index: -5;
            background:
                radial-gradient(ellipse at 76% 24%, rgba(255, 153, 51, .30), transparent 25%),
                radial-gradient(ellipse at 12% 82%, rgba(19, 136, 8, .20), transparent 28%),
                linear-gradient(115deg, #060a10 0%, #15131a 50%, #06110b 100%);
            filter: blur(42px);
            transform: translate(
                calc(var(--pointer-x) * -15px),
                calc(var(--pointer-y) * -15px)
            );
            animation: meshDrift 18s ease-in-out infinite alternate;
        }

        .grain {
            position: absolute;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            opacity: .11;
            mix-blend-mode: screen;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
        }

        .vignette {
            position: absolute;
            inset: 0;
            z-index: 4;
            pointer-events: none;
            background:
                linear-gradient(90deg, rgba(3, 6, 10, .96) 0%, rgba(3, 6, 10, .54) 22%, rgba(3, 6, 10, .10) 55%, rgba(3, 6, 10, .74) 100%),
                linear-gradient(180deg, rgba(0,0,0,.52), transparent 22%, transparent 76%, rgba(0,0,0,.72)),
                radial-gradient(circle at center, transparent 28%, rgba(0,0,0,.60) 100%);
        }

        .particle-field {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            transform: translate(
                calc(var(--pointer-x) * 8px),
                calc(var(--pointer-y) * 8px)
            );
            transition: transform 1s ease-out;
        }

        .particle-field span {
            position: absolute;
            left: var(--left);
            top: var(--top);
            width: var(--size);
            height: var(--size);
            border-radius: 50%;
            background: rgba(255, 205, 155, .62);
            box-shadow: 0 0 13px rgba(255, 153, 51, .55);
            animation: float 6s ease-in-out infinite;
            animation-delay: var(--delay);
        }

        .cinematic-stream {
            position: absolute;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            transform: translate(
                calc(var(--pointer-x) * 18px),
                calc(var(--pointer-y) * 11px)
            );
            transition: transform 1.5s cubic-bezier(.2,.8,.2,1);
        }

        .stream-glow {
            position: absolute;
            left: -10%;
            top: 15%;
            width: 72%;
            height: 70%;
            background: radial-gradient(ellipse, rgba(255, 153, 51, .11), transparent 65%);
            filter: blur(45px);
        }

        .portrait {
            position: absolute;
            margin: 0;
            width: clamp(210px, 20vw, 330px);
            aspect-ratio: .72;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.14);
            background: rgba(10,12,15,.45);
            box-shadow: 0 35px 90px rgba(0,0,0,.65);
            opacity: 0;
            will-change: transform, opacity;
            animation: procession 16s cubic-bezier(.45,0,.2,1) infinite;
            animation-delay: calc(var(--portrait-index) * 4s - 1s);
        }

        .portrait-image-wrap {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .portrait img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: center top;
            filter: grayscale(.72) sepia(.18) contrast(1.16) brightness(.82);
            transform: scale(1.03);
        }

        .portrait::before {
            content: "";
            position: absolute;
            z-index: 2;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(255,153,51,.10), transparent 35%),
                linear-gradient(180deg, transparent 42%, rgba(3,5,8,.92) 100%);
        }

        .portrait::after {
            content: "";
            position: absolute;
            z-index: 3;
            inset: 0;
            border: 1px solid rgba(255,255,255,.08);
            box-shadow: inset 0 0 80px rgba(0,0,0,.35);
        }

        .portrait figcaption {
            position: absolute;
            z-index: 4;
            left: 22px;
            right: 18px;
            bottom: 21px;
            display: grid;
            gap: 5px;
            text-transform: uppercase;
        }

        .portrait figcaption strong {
            font-family: "Playfair Display", serif;
            font-size: 17px;
            font-weight: 500;
            letter-spacing: .035em;
        }

        .portrait figcaption span {
            color: var(--saffron);
            font-size: 8px;
            font-weight: 600;
            letter-spacing: .22em;
        }

        .portrait-mother { top: 10%; left: 8%; --start-y: 0vh; --depth: 1; }
        .portrait-bhagat { top: 43%; left: 28%; --start-y: 10vh; --depth: .86; }
        .portrait-azad { top: 7%; left: 51%; --start-y: -7vh; --depth: .76; }
        .portrait-bose { top: 52%; left: 67%; --start-y: 7vh; --depth: .67; }

        .top-meta, .bottom-meta {
            position: absolute;
            z-index: 7;
            font-size: 8px;
            letter-spacing: .24em;
            text-transform: uppercase;
            color: rgba(255,255,255,.56);
        }

        .top-meta {
            top: 34px;
            left: 42px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .top-meta .number { color: var(--saffron); }

        .meta-line {
            width: 42px;
            height: 1px;
            background: rgba(255,255,255,.24);
        }

        .bottom-meta {
            right: 42px;
            bottom: 30px;
        }

        .login-shell {
            position: relative;
            z-index: 6;
            width: min(410px, calc(100% - 42px));
            margin-left: 38%;
            padding: 48px 44px 31px;
            background: rgba(7, 11, 17, .77);
            border: 1px solid rgba(255,255,255,.14);
            box-shadow: 0 40px 110px rgba(0,0,0,.56), inset 0 1px rgba(255,255,255,.09);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            animation: reveal .95s cubic-bezier(.2,.8,.2,1) both;
        }

        .national-mark {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            margin-bottom: 26px;
            border: 1px solid rgba(255,157,69,.58);
            border-radius: 50%;
            color: var(--saffron);
            font-size: 17px;
            box-shadow: 0 0 25px rgba(255,153,51,.08);
        }

        .eyebrow {
            margin: 0 0 13px;
            color: var(--saffron);
            font-size: 9px;
            font-weight: 600;
            letter-spacing: .31em;
        }

        h1 {
            margin: 0;
            font-family: "Playfair Display", serif;
            font-size: clamp(45px, 5vw, 61px);
            line-height: .91;
            font-weight: 500;
            letter-spacing: -.05em;
        }

        h1 em {
            color: var(--saffron);
            font-style: italic;
        }

        .intro {
            margin: 20px 0 31px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.65;
        }

        .login-form { display: grid; gap: 8px; }

        .login-form label {
            margin-top: 8px;
            color: #d7d0c8;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: .17em;
            text-transform: uppercase;
        }

        .login-form input {
            width: 100%;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 0;
            outline: 0;
            padding: 14px 13px;
            color: #fff;
            background: rgba(255,255,255,.035);
            transition: .25s ease;
        }

        .login-form input::placeholder { color: #6e6b67; }

        .login-form input:focus {
            border-color: rgba(255,157,69,.85);
            background: rgba(255,153,51,.055);
            box-shadow: 0 0 0 3px rgba(255,153,51,.08);
        }

        .login-form button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 19px;
            border: 0;
            border-radius: 0;
            padding: 16px 17px;
            color: #1a1009;
            background: var(--saffron);
            cursor: pointer;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .16em;
            text-transform: uppercase;
            transition: .25s ease;
        }

        .login-form button:hover {
            transform: translateY(-2px);
            background: #ffb675;
            box-shadow: 0 13px 32px rgba(255,153,51,.20);
        }

        .login-form button b {
            font-size: 17px;
            font-weight: 400;
        }

        .demo-note {
            margin: 10px 0 0;
            color: #9dcc88;
            font-size: 10px;
        }

        footer {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 36px;
            color: #77736e;
            font-size: 8px;
            letter-spacing: .17em;
            text-transform: uppercase;
        }

        footer i {
            height: 1px;
            flex: 1;
            background: rgba(255,255,255,.14);
        }

        @keyframes procession {
            0% { opacity: 0; transform: translate3d(58vw, var(--start-y), 0) scale(calc(var(--depth) * .72)) rotate(-4deg); filter: blur(9px); }
            12% { opacity: 0; }
            24% { opacity: .46; transform: translate3d(22vw, 0, 0) scale(calc(var(--depth) * .88)) rotate(-2deg); filter: blur(2px); }
            42% { opacity: .68; transform: translate3d(0, 0, 0) scale(var(--depth)) rotate(0deg); filter: blur(0); }
            62% { opacity: .50; transform: translate3d(-25vw, -2vh, 0) scale(calc(var(--depth) * .92)) rotate(2deg); filter: blur(1px); }
            78% { opacity: .18; transform: translate3d(-54vw, -4vh, 0) scale(calc(var(--depth) * .78)) rotate(4deg); filter: blur(5px); }
            100% { opacity: 0; transform: translate3d(-80vw, -6vh, 0) scale(calc(var(--depth) * .66)) rotate(5deg); filter: blur(11px); }
        }

        @keyframes reveal {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes meshDrift {
            from { transform: scale(1) translate(calc(var(--pointer-x) * -15px), calc(var(--pointer-y) * -15px)); }
            to { transform: scale(1.08) translate(calc(var(--pointer-x) * -15px), calc(var(--pointer-y) * -15px)); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); opacity: .15; }
            50% { transform: translateY(-25px); opacity: .8; }
        }

        @media (max-width: 900px) {
            body { overflow: hidden; }
            .portrait { width: 190px; }
            .portrait-mother { left: -5%; }
            .portrait-bhagat { left: 17%; }
            .portrait-azad { left: 48%; }
            .portrait-bose { left: 70%; }
            .login-shell { margin-left: 18%; width: min(390px, calc(100% - 32px)); }
        }

        @media (max-width: 650px) {
            .login-shell { margin-left: 0; width: min(390px, calc(100% - 28px)); padding: 35px 27px 27px; }
            .cinematic-stream { opacity: .42; }
            .portrait { width: 160px; }
            .portrait-bhagat { left: 0; }
            .portrait-azad { left: 58%; }
            .portrait-bose { left: 76%; }
            .top-meta { left: 20px; top: 20px; }
            .bottom-meta { right: 20px; bottom: 20px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .portrait, .mesh, .particle-field span, .login-shell { animation: none; }
            .portrait { opacity: .45; }
        }
    </style>
</head>
<body>
    <main class="portal" style="--pointer-x: 0; --pointer-y: 0;">
        <div class="mesh"></div>
        <div class="grain"></div>
        <div class="particle-field" aria-hidden="true" id="particles"></div>
        <section class="cinematic-stream" aria-label="Historical freedom fighters" id="portraits">
            <div class="stream-glow"></div>
        </section>
        <div class="vignette"></div>
        <div class="top-meta">
            <span class="number">01 / 04</span>
            <span class="meta-line"></span>
            <span>REMEMBER THE COURAGE</span>
        </div>
        <section class="login-shell">
            <div class="national-mark">✦</div>
            <p class="eyebrow">A LIVING TRIBUTE</p>
            <h1>Remember.<br><em>Rise.</em></h1>
            <p class="intro">The courage of a nation,<br>carried forward.</p>
            <form class="login-form" id="loginForm">
                <label for="email">Email</label>
                <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
                <button type="submit">
                    <span>Enter the story</span>
                    <b>↗</b>
                </button>
                <p class="demo-note" id="demoNote" style="display: none;">Demo mode — your details were not sent anywhere.</p>
            </form>
            <footer>
                <span>सत्यमेव जयते</span>
                <i></i>
                <span>INDIA · 01</span>
            </footer>
        </section>
        <div class="bottom-meta">INDIA · 1947 — FOREVER</div>
    </main>

    <script>
        // Setup Particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 42; i++) {
            const span = document.createElement('span');
            span.style.setProperty('--left', `${(i * 31) % 100}%`);
            span.style.setProperty('--top', `${(i * 43) % 100}%`);
            span.style.setProperty('--delay', `${(i % 9) * -0.65}s`);
            span.style.setProperty('--size', `${2 + (i % 3)}px`);
            particlesContainer.appendChild(span);
        }

        // Setup Portraits
        const portraitsData = [
          { name: "Bharata Mata", role: "The Motherland", image: "https://images.unsplash.com/photo-1597058712635-3182d1eacc1e?auto=format&fit=crop&w=1400&q=90", className: "portrait-mother" },
          { name: "Bhagat Singh", role: "Revolutionary", image: "https://commons.wikimedia.org/wiki/Special:FilePath/Bhagat%20Singh%201929.jpg?width=1200", className: "portrait-bhagat" },
          { name: "Chandrashekhar Azad", role: "Revolutionary", image: "https://commons.wikimedia.org/wiki/Special:FilePath/Chandrashekhar%20Azad.jpg?width=1200", className: "portrait-azad" },
          { name: "Subhash Chandra Bose", role: "Nationalist Leader", image: "https://commons.wikimedia.org/wiki/Special:FilePath/Subhas%20Chandra%20Bose.jpg?width=1200", className: "portrait-bose" }
        ];
        const streamContainer = document.getElementById('portraits');
        portraitsData.forEach((p, index) => {
            const figure = document.createElement('figure');
            figure.className = `portrait ${p.className}`;
            figure.style.setProperty('--portrait-index', index);
            figure.innerHTML = `
                <div class="portrait-image-wrap">
                  <img src="${p.image}" alt="${p.name}" onerror="this.style.display='none'" />
                </div>
                <figcaption>
                  <strong>${p.name}</strong>
                  <span>${p.role}</span>
                </figcaption>
            `;
            streamContainer.appendChild(figure);
        });

        // Pointer tracking
        const portal = document.querySelector('.portal');
        window.addEventListener('pointermove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 2;
            const y = (e.clientY / window.innerHeight - 0.5) * 2;
            portal.style.setProperty('--pointer-x', x);
            portal.style.setProperty('--pointer-y', y);
        });

        // Form submission
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            document.getElementById('demoNote').style.display = 'block';
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
body {
            margin: 0;
            padding: 0;
            font-family: 'DM Sans', sans-serif;
            background-color: #cbd5e1;
            color: #1e293b;
            min-height: 100vh;
            overflow-x: hidden;
        }
        #app-wrapper {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), border-radius 0.6s ease, opacity 0.6s ease;
            transform-origin: center left;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
        }
        body.reels-active #app-wrapper {
            transform: scale(0.88) translateX(-2%);
            border-radius: 30px;
            pointer-events: none;
            opacity: 0.7;
        }
        
        #reels-panel {
            position: fixed;
            top: 0;
            right: -450px;
            width: 420px;
            height: 100vh;
            background: #ffffff;
            box-shadow: -15px 0 50px rgba(0,0,0,0.15);
            z-index: 2000;
            transition: right 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            flex-direction: column;
        }
        body.reels-active #reels-panel {
            right: 0;
        }
        .reels-header {
            padding: 24px 30px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .reels-header h3 {
            margin: 0;
            font-size: 22px;
        }
        .reels-header button {
            background: #f1f5f9;
            border: none;
            width: 40px; height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            color: #64748b;
            transition: background 0.2s;
        }
        .reels-header button:hover {
            background: #e2e8f0;
            color: #1e293b;
        }
        .reels-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            color: #64748b;
            gap: 15px;
        }
        .reels-content i {
            font-size: 48px;
            color: #cbd5e1;
        }
        .header {
            padding: 20px 40px;
            border-bottom: 1px solid #e2e8f0;
        }
        .header h2 {
            margin: 0;
            font-size: 24px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 40px 40px 20px 40px;
        }
        .gallery img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .action-bar-container {
            display: flex;
            justify-content: center;
            padding: 0 40px 60px;
        }
        .action-bar {
            display: flex;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 1000px;
        }
        .action-bar button {
            flex: 1;
            padding: 20px 20px;
            border: none;
            background: #ffffff;
            border-right: 1px solid #e2e8f0;
            color: #1e293b;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .action-bar button:last-child {
            border-right: none;
        }
        .action-bar button:hover {
            background: #f8fafc;
            transform: translateY(-2px);
        }
        .action-bar button.logout {
            color: #e11d48;
        }
        .action-bar i {
            font-size: 20px;
            color: #64748b;
        }
        .action-bar button:hover i {
            color: #1e293b;
        }
        .action-bar button.logout i {
            color: #e11d48;
        }

        /* Blur Overlay */
        #blur-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 998;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        #blur-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Interactive Profile Widget */
        #profile-widget {
            position: fixed;
            bottom: 40px;
            left: 40px;
            width: 60px;
            height: 60px;
            margin-bottom: 0;
            margin-left: 0;
            border-radius: 50%;
            z-index: 1000;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 3px solid #ffffff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
        }
        #profile-widget img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        /* Expanded State */
        #profile-widget.expanded {
            bottom: 50%;
            left: 50%;
            width: 280px;
            height: 280px;
            margin-bottom: -140px;
            margin-left: -140px;
            border-width: 6px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        
        /* Small label below the widget when small */
        #profile-label {
            position: fixed;
            bottom: 15px;
            left: 40px;
            width: 60px;
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            color: #1e293b;
            z-index: 999;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        #profile-widget.expanded ~ #profile-label {
            opacity: 0;
        }

        /* Message when expanded */
        #ganga-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, 140px);
            color: #1e293b;
            font-size: 20px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            opacity: 0;
            pointer-events: none;
            z-index: 1001;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            transition-delay: 0.1s;
            white-space: nowrap;
            letter-spacing: -0.02em;
        }
        #profile-widget.expanded ~ #ganga-message {
            opacity: 1;
            transform: translate(-50%, 170px);
        }
    </style>
</head>
<body>
    <div id="app-wrapper">
    <div class="header">
        <h2>Admin Portal</h2>
    </div>
    
    <div class="gallery">
        <img src="/static/images/bharatamata.jpg" alt="Bharata Mata">
        <img src="/static/images/bharatamata_lion.png" alt="Bharata Mata with Lion">
        <img src="/static/images/tilak.webp" alt="Tilak">
        <img src="/static/images/bose.jpg" alt="Bose">
        <img src="/static/images/tagore.jpg" alt="Tagore Bharata Mata">
    </div>

    <div class="action-bar-container">
        <div class="action-bar">
            <button onclick="alert('About section coming soon!')">
                <i class="fa-solid fa-circle-info"></i>
                About
            </button>
            <button onclick="alert('History section coming soon!')">
                <i class="fa-solid fa-landmark"></i>
                History
            </button>
            <button onclick="alert('Story section coming soon!')">
                <i class="fa-solid fa-book-open"></i>
                Story
            </button>
            <button onclick="toggleReels()">
                <i class="fa-solid fa-clapperboard"></i>
                Reels
            </button>
            <button onclick="alert('Settings coming soon!')">
                <i class="fa-solid fa-gear"></i>
                Settings
            </button>
            <button class="logout" onclick="window.location.href='/'">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                Log Out
            </button>
        </div>
    </div>

    <!-- Interactive Profile Widget & Blur Overlay -->
    <div id="blur-overlay" onclick="toggleProfile()"></div>
    <div id="profile-widget" onclick="toggleProfile()">
        <img src="/static/images/ganga.jpg" alt="Ganga">
    </div>
    <div id="profile-label">Ganga</div>
    <div id="ganga-message">"I am Ganga. This feature will come soon."</div>

    </div> <!-- end app-wrapper -->

    <!-- Reels Panel -->
    <div id="reels-panel">
        <div class="reels-header">
            <h3>Reels</h3>
            <button onclick="toggleReels()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="reels-content">
            <i class="fa-solid fa-film"></i>
            <p>Reels Feed Coming Soon</p>
        </div>
    </div>
    <script>
function toggleReels() {
            document.body.classList.toggle('reels-active');
        }

        let femaleVoice = null;
        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            // Look for common female voice names
            femaleVoice = voices.find(v => 
                v.name.includes('Zira') || 
                v.name.includes('Female') || 
                v.name.includes('Samantha') || 
                v.name.includes('Google UK English Female') || 
                v.name.includes('Victoria')
            );
            if (!femaleVoice && voices.length > 0) {
                // Fallback to the first voice if no female identifier found
                femaleVoice = voices[0];
            }
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        // Call immediately in case voices are already loaded
        loadVoices();

        function toggleProfile() {
            const widget = document.getElementById('profile-widget');
            const overlay = document.getElementById('blur-overlay');
            
            const isExpanding = !widget.classList.contains('expanded');
            
            widget.classList.toggle('expanded');
            overlay.classList.toggle('active');

            if (isExpanding) {
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance("I am Ganga. This feature will come soon.");
                if (femaleVoice) {
                    utterance.voice = femaleVoice;
                }
                utterance.pitch = 1.4; // Higher pitch for female/child
                utterance.rate = 0.95; 
                
                window.speechSynthesis.speak(utterance);
            } else {
                window.speechSynthesis.cancel();
            }
        }
    </script>
</body>
</html>
